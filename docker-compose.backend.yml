services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: connecto
      POSTGRES_PASSWORD: connecto
      POSTGRES_USER: connecto
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U connecto -d connecto']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'
    volumes:
      - connecto-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '6379:6379'

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command:
      [
        'azurite-blob',
        '--blobHost',
        '0.0.0.0',
        '--loose',
        '--skipApiVersionCheck',
      ]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:10000/devstoreaccount1'').then(()=>process.exit(0)).catch(()=>process.exit(1));"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '10000:10000'
    volumes:
      - connecto-azurite-data:/data

  api:
    build:
      context: .
      dockerfile: backend/apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_healthy
    env_file:
      - ./backend/apps/api/.env.example
    ports:
      - '4000:4000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4000/healthz'').then((response)=>{process.exit(response.ok?0:1);}).catch(()=>process.exit(1));"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/apps/worker/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_healthy
    env_file:
      - ./backend/apps/worker/.env.example
    ports:
      - '4001:4001'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4001/healthz'').then((response)=>{process.exit(response.ok?0:1);}).catch(()=>process.exit(1));"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  connecto-azurite-data:
  connecto-postgres-data:
